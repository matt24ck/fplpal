# Grounding evals spend real Anthropic money (one live chat turn per case),
# so they run only when the chat surface changes — the system prompt / tool
# loop (api/chat.py), the tool implementations (api/tools.py), or the eval
# suite itself — or on manual dispatch. Needs the ANTHROPIC_API_KEY repo
# secret. The job seeds a throwaway data volume the same way a fresh deploy
# does (historical archive -> feature builds -> live snapshot -> pipeline);
# if the FPL API is in its maintenance window the snapshot step fails —
# re-run the job later.
name: grounding-evals

on:
  push:
    branches: [main]
    paths:
      - api/chat.py
      - api/tools.py
      - backtest/grounding_evals.py
  pull_request:
    paths:
      - api/chat.py
      - api/tools.py
      - backtest/grounding_evals.py
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: require the API key secret
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repo secret is not set"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: cache the historical archive (~45 MB, static)
        uses: actions/cache@v4
        with:
          path: data/historical
          key: vaastav-archive-2016-2026
      - run: python -m engine.ingest.historical
      - run: python -m engine.features.historical_gw
      - run: python -m engine.features.matches
      - run: python -m engine.ingest.snapshot
      # the committed ratings-weights cache spares this run the replay refit
      - run: python -m engine.pipeline
      - run: python -m backtest.grounding_evals
