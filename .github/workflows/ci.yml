# The cheap always-on gate: lint + data-free tests + web build, a few minutes
# total. Nothing here touches the data volume, the FPL API, or Anthropic —
# the grounding evals (which spend real money) live in grounding-evals.yml
# and only run when the chat surface changes.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # tests/ is import-and-pure-function only by design: no parquets in CI
      - run: pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # dummy publishable key (base64 of a placeholder Clerk domain) — the
      # build only needs the key to parse; no Clerk network calls happen
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
