[project]
name = "fpl-engine"
version = "0.1.0"
description = "FPL AI assistant — stats engine, optimizer, and API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.13",
    "lightgbm>=4.3",
    "scikit-learn>=1.5",
    "pulp>=2.8",
    "highspy>=1.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "anthropic>=0.116",
    "python-dotenv>=1.0",
    "apscheduler>=3.10",
    "pyjwt[crypto]>=2.8",
    "psycopg[binary,pool]>=3.2",
    "sentry-sdk>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # upper-bounded: CI installs fresh, and a ruff minor can promote new
    # default rules overnight (0.16.1 broke a green tree) — bump deliberately
    "ruff>=0.16,<0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
